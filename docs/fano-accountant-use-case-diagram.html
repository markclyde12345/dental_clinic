<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FANO Dental Clinic - Accountant Use Case Diagram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    svg {
      background-color: #ffffff;
      display: block;
    }
    .actor-label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      fill: #111111;
      text-anchor: middle;
    }
    .uc-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: #222222;
      text-anchor: middle;
    }
  </style>
</head>
<body>

  <svg width="760" height="950" viewBox="0 0 760 950" xmlns="http://www.w3.org/2000/svg">
    <!-- System Boundary Box -->
    <rect x="465" y="18" width="265" height="914" fill="#ffffff" stroke="#111111" stroke-width="1.8" />

    <!-- Stick Figure Actor: Accountant -->
    <!-- Head -->
    <circle cx="115" cy="355" r="46" fill="#ffffff" stroke="#222222" stroke-width="1.6" />
    <!-- Spine -->
    <line x1="115" y1="401" x2="115" y2="580" stroke="#222222" stroke-width="1.6" />
    <!-- Arms (Left X=25 to Right X=205 at Y=445) -->
    <line x1="25" y1="445" x2="205" y2="445" stroke="#222222" stroke-width="1.6" />
    <!-- Left Leg -->
    <line x1="115" y1="580" x2="25" y2="735" stroke="#222222" stroke-width="1.6" />
    <!-- Right Leg -->
    <line x1="115" y1="580" x2="205" y2="735" stroke="#222222" stroke-width="1.6" />
    <!-- Actor Label -->
    <text x="115" y="772" class="actor-label">Accountant</text>

    <!-- Association Lines from Actor Right Hand (205, 445) to each Use Case Ellipse Left Edge -->
    <g stroke="#222222" stroke-width="1.5">
      <line x1="205" y1="445" x2="493" y2="68" />
      <line x1="205" y1="445" x2="488" y2="167" />
      <line x1="205" y1="445" x2="488" y2="266" />
      <line x1="205" y1="445" x2="488" y2="365" />
      <line x1="205" y1="445" x2="488" y2="464" />
      <line x1="205" y1="445" x2="488" y2="563" />
      <line x1="205" y1="445" x2="488" y2="662" />
      <line x1="205" y1="445" x2="488" y2="761" />
      <line x1="205" y1="445" x2="493" y2="862" />
    </g>

    <!-- 1. Login -->
    <ellipse cx="598" cy="68" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="73" class="uc-text">Login</text>

    <!-- 2. View Financial Overview & KPIs -->
    <ellipse cx="598" cy="167" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="163" class="uc-text">View Financial</text>
    <text x="598" y="180" class="uc-text">Overview &amp; KPIs</text>

    <!-- 3. Manage Invoices Ledger -->
    <ellipse cx="598" cy="266" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="262" class="uc-text">Create &amp; Manage</text>
    <text x="598" y="279" class="uc-text">Invoices Ledger</text>

    <!-- 4. Payments & Collections -->
    <ellipse cx="598" cy="365" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="361" class="uc-text">Record Payments</text>
    <text x="598" y="378" class="uc-text">&amp; Collections</text>

    <!-- 5. Manage Clinic Expenses & Bills -->
    <ellipse cx="598" cy="464" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="460" class="uc-text">Manage Expenses</text>
    <text x="598" y="477" class="uc-text">&amp; Utility Bills</text>

    <!-- 6. Monitor Inventory Costs -->
    <ellipse cx="598" cy="563" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="559" class="uc-text">Monitor Inventory</text>
    <text x="598" y="576" class="uc-text">&amp; Supply Costs</text>

    <!-- 7. Generate Financial Reports -->
    <ellipse cx="598" cy="662" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="658" class="uc-text">Generate Financial</text>
    <text x="598" y="675" class="uc-text">Reports &amp; Ledgers</text>

    <!-- 8. Configure Financial Settings -->
    <ellipse cx="598" cy="761" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="757" class="uc-text">Financial &amp;</text>
    <text x="598" y="774" class="uc-text">Billing Settings</text>

    <!-- 9. Logout -->
    <ellipse cx="598" cy="862" rx="110" ry="37" fill="#ffffff" stroke="#222222" stroke-width="1.5" />
    <text x="598" y="867" class="uc-text">Logout</text>

  </svg>

</body>
</html>
