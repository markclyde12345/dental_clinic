<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating — Fano Dental Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --primary: #0b3c4d;
      --primary-dark: #072733;
      --accent: #0e7490;
      --accent-light: #e0f2fe;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
      --red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, rgba(14, 116, 144, 0.08), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.06), transparent 40%),
                  var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .callback-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05),
                  0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 16px;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .status-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .status-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-box {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: left;
    }

    .btn-return {
      display: none;
      width: 100%;
      padding: 12px 20px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }

    .btn-return:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>

  <div class="callback-card">
    <div class="logo-badge" id="card-icon">
      <i class="ti ti-brand-facebook"></i>
    </div>
    <div class="spinner" id="loading-spinner"></div>
    <h2 class="status-title" id="status-title">Signing you in with Facebook...</h2>
    <p class="status-desc" id="status-desc">
      Please wait while we verify your social credentials and connect your clinic account.
    </p>

    <div class="error-box" id="error-box"></div>
    <a href="login.html" class="btn-return" id="btn-return">Return to Login</a>
  </div>

  <script>
    (async function handleOAuthCallback() {
      const titleEl = document.getElementById('status-title');
      const descEl = document.getElementById('status-desc');
      const spinner = document.getElementById('loading-spinner');
      const iconEl = document.getElementById('card-icon');
      const errorBox = document.getElementById('error-box');
      const btnReturn = document.getElementById('btn-return');

      function showError(msg) {
        if (spinner) spinner.style.display = 'none';
        if (iconEl) {
          iconEl.style.background = '#fef2f2';
          iconEl.style.color = '#ef4444';
          iconEl.innerHTML = '<i class="ti ti-alert-circle"></i>';
        }
        titleEl.textContent = 'Authentication Failed';
        descEl.textContent = 'We were unable to complete sign in with Facebook.';
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        btnReturn.style.display = 'inline-block';
      }

      try {
        // 1. Check URL Hash (Implicit Flow from Supabase)
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        const accessToken = hashParams.get('access_token');
        const hashError = hashParams.get('error_description') || hashParams.get('error');

        // 2. Check URL Search Query (PKCE Flow or Error)
        const searchParams = new URLSearchParams(window.location.search);
        const code = searchParams.get('code');
        const queryError = searchParams.get('error_description') || searchParams.get('error');

        if (hashError || queryError) {
          showError(decodeURIComponent(hashError || queryError));
          return;
        }

        if (!accessToken && !code) {
          showError('No authentication token or authorization code was found in the callback URL.');
          return;
        }

        // 3. Determine backend API URL
        const isLocal = (
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1'
        );
        const backendOrigin = (isLocal && window.location.port !== '5000' && window.location.port !== '')
          ? `${window.location.protocol}//${window.location.hostname}:5000`
          : '';

        titleEl.textContent = 'Verifying Account...';
        descEl.textContent = 'Connecting with clinic database and setting up your patient portal session...';

        // 4. Send token / code to backend social login endpoint
        const response = await fetch(`${backendOrigin}/api/auth/social-login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            access_token: accessToken,
            code: code,
            provider: 'facebook'
          })
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
          throw new Error(data.message || 'Failed to authenticate social account with clinic server.');
        }

        // 5. Store session in localStorage
        localStorage.setItem('token', data.token);
        localStorage.setItem('userInfo', JSON.stringify(data));

        titleEl.textContent = 'Success! Redirecting...';
        descEl.textContent = `Welcome back, ${data.name || data.firstName || 'Patient'}! Directing you to your portal...`;
        if (iconEl) {
          iconEl.style.background = '#e3fcef';
          iconEl.style.color = '#0e6245';
          iconEl.innerHTML = '<i class="ti ti-check"></i>';
        }

        // 6. Redirect to role dashboard
        setTimeout(() => {
          if (data.role === 'Admin') {
            window.location.href = 'admin-dashboard.html';
          } else if (data.role === 'Dentist') {
            window.location.href = 'dentist-dashboard.html';
          } else if (data.role === 'Receptionist') {
            window.location.href = 'receptionist-dashboard.html';
          } else if (data.role === 'Accounting') {
            window.location.href = 'accounting-dashboard.html';
          } else {
            window.location.href = 'patient-dashboard.html';
          }
        }, 800);

      } catch (err) {
        showError(err.message || 'An unexpected error occurred during social login.');
      }
    })();
  </script>
</body>
</html>
