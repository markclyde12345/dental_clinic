<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Fano Dental Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=11">
  <link rel="stylesheet" href="../css/auth.css?v=11">
</head>
<body>

  <div class="auth-page">
    <div class="auth-blob verify-blob-1"></div>
    <div class="auth-blob verify-blob-2"></div>

    <div class="auth-card">

      <a href="landing-page.html" class="auth-logo">
        <img src="../Resources/logo.png" alt="Fano Dental Clinic">
      </a>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join us for a premium dental experience</p>

      <form class="auth-form" id="signup-form" novalidate>

        <div class="signup-row-flex">
          <div class="form-group-minimal">
            <label for="signup-firstname">First Name</label>
            <input type="text" id="signup-firstname" placeholder="John" required autocomplete="given-name">
          </div>
          <div class="form-group-minimal">
            <label for="signup-lastname">Last Name</label>
            <input type="text" id="signup-lastname" placeholder="Doe" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group-minimal">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group-minimal">
          <label for="signup-phone">Contact Number</label>
          <input type="tel" id="signup-phone" placeholder="09171234567" required autocomplete="tel">
        </div>

        <div class="form-group-minimal">
          <label for="signup-address">Home Address</label>
          <input type="text" id="signup-address" placeholder="123 Mabini St, Manila" required autocomplete="street-address">
        </div>

        <div class="form-group-minimal">
          <label for="signup-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-password" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="password-rules-box" id="password-rules" style="margin-top: 6px; font-size: 0.78rem; color: #64748b; background: #f8fafc; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0;">
            <div style="font-weight: 600; margin-bottom: 4px; color: #0b3c4d;">Password Requirements:</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
              <span id="rule-len" class="rule-item" style="display: flex; align-items: center; gap: 4px;"><span class="rule-dot">○</span> 8+ Characters</span>
              <span id="rule-upper" class="rule-item" style="display: flex; align-items: center; gap: 4px;"><span class="rule-dot">○</span> Uppercase letter</span>
              <span id="rule-lower" class="rule-item" style="display: flex; align-items: center; gap: 4px;"><span class="rule-dot">○</span> Lowercase letter</span>
              <span id="rule-num" class="rule-item" style="display: flex; align-items: center; gap: 4px;"><span class="rule-dot">○</span> Number</span>
              <span id="rule-spec" class="rule-item" style="display: flex; align-items: center; gap: 4px; grid-column: span 2;"><span class="rule-dot">○</span> Special character (!@#$%^&amp;*)</span>
            </div>
          </div>
        </div>

        <div class="form-group-minimal">
          <label for="signup-confirm">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-confirm" placeholder="Repeat your password" required autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="terms-agreement-wrap">
          <label class="terms-label" for="signup-terms">
            <input type="checkbox" id="signup-terms" required>
            <span>I have read and agree to the <a href="javascript:void(0)" class="open-terms-link">Terms of Service</a> &amp; <a href="javascript:void(0)" class="open-privacy-link">Privacy Policy</a></span>
          </label>
        </div>

        <button type="submit" class="auth-btn" id="signup-btn">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>

    </div>
  </div>

  <!-- Terms & Privacy Modal -->
  <div class="auth-modal-backdrop" id="termsModal">
    <div class="auth-modal-card" role="dialog" aria-modal="true">
      <div class="auth-modal-header">
        <h2 id="modalTitle">Terms of Service &amp; Agreement</h2>
        <button type="button" class="auth-modal-close" id="closeTermsModal" aria-label="Close modal">✕</button>
      </div>
      <div class="auth-modal-body" id="modalBody">
        <!-- Injected via auth.js -->
      </div>
      <div class="auth-modal-footer">
        <button type="button" class="auth-modal-btn" id="agreeModalBtn">I Understand &amp; Agree</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
