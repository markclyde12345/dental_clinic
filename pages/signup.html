<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Fano Dental Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=11">
  <link rel="stylesheet" href="../css/auth.css?v=11">
</head>
<body>

  <div class="auth-page">
    <div class="auth-blob verify-blob-1"></div>
    <div class="auth-blob verify-blob-2"></div>

    <div class="auth-card">

      <a href="landing-page.html" class="auth-logo">
        <img src="../Resources/logo.png" alt="Fano Dental Clinic">
      </a>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join us for a premium dental experience</p>

      <form class="auth-form" id="signup-form" novalidate>

        <div class="signup-row-flex">
          <div class="form-group-minimal">
            <label for="signup-firstname">First Name</label>
            <input type="text" id="signup-firstname" placeholder="John" required autocomplete="given-name">
          </div>
          <div class="form-group-minimal">
            <label for="signup-lastname">Last Name</label>
            <input type="text" id="signup-lastname" placeholder="Doe" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group-minimal">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group-minimal">
          <label for="signup-phone">Contact Number</label>
          <input type="tel" id="signup-phone" placeholder="09171234567" required autocomplete="tel">
        </div>

        <div class="form-group-minimal">
          <label for="signup-address">Home Address</label>
          <input type="text" id="signup-address" placeholder="123 Mabini St, Manila" required autocomplete="street-address">
        </div>

        <div class="form-group-minimal">
          <label for="signup-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-password" placeholder="At least 8 characters" required autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group-minimal">
          <label for="signup-confirm">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-confirm" placeholder="Repeat your password" required autocomplete="new-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="signup-btn">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>

    </div>
  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
