<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Fano Dental Clinic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=11">
  <link rel="stylesheet" href="../css/auth.css?v=12">
</head>
<body>

  <div class="auth-page">
    <div class="auth-blob verify-blob-1"></div>
    <div class="auth-blob verify-blob-2"></div>

    <div class="auth-card">

      <a href="landing-page.html" class="auth-logo">
        <img src="../Resources/logo.png" alt="Fano Dental Clinic">
      </a>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <form class="auth-form" id="login-form" novalidate>

        <div class="form-group-minimal">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="name@domain.com" required autocomplete="email">
          <div class="field-error-msg" id="email-error" style="display: none;"></div>
        </div>

        <div class="form-group-minimal">
          <label for="login-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="field-error-msg" id="password-error" style="display: none;"></div>
        </div>

        <div class="auth-actions">
          <label>
            <input type="checkbox" id="remember-me"> Remember me  
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="auth-btn" id="login-btn">Log In</button>

        <p class="auth-agreement-notice">
          By continuing, you agree to our <a href="javascript:void(0)" class="open-terms-link">Terms of Service</a> &amp; <a href="javascript:void(0)" class="open-privacy-link">Privacy Policy</a>.
        </p>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>

    </div>
  </div>

  <!-- Terms & Privacy Modal -->
  <div class="auth-modal-backdrop" id="termsModal">
    <div class="auth-modal-card" role="dialog" aria-modal="true">
      <div class="auth-modal-header">
        <h2 id="modalTitle">Terms of Service &amp; Agreement</h2>
        <button type="button" class="auth-modal-close" id="closeTermsModal" aria-label="Close modal">✕</button>
      </div>
      <div class="auth-modal-body" id="modalBody">
        <!-- Injected via auth.js -->
      </div>
      <div class="auth-modal-footer">
        <button type="button" class="auth-modal-btn" id="agreeModalBtn">Understood</button>
      </div>
    </div>
  </div>

  <script src="../js/auth.js?v=20260911_admin_mfa"></script>
</body>
</html>
